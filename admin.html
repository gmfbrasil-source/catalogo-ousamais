<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Ousamais</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: #f5f5f5; color: #333; }
  .header { background: #1a1a2e; color: white; padding: 16px 20px; display: flex; align-items: center; gap: 12px; }
  .header h1 { font-size: 18px; }
  .header a { color: #aaa; font-size: 13px; margin-left: auto; text-decoration: none; }
  .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
  .login-box { max-width: 360px; margin: 80px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.1); text-align: center; }
  .login-box h2 { margin-bottom: 16px; font-size: 18px; }
  .login-box input { width: 100%; padding: 10px 14px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; }
  .login-box input:focus { border-color: #1a1a2e; }
  .login-box button { margin-top: 12px; padding: 10px 24px; background: #1a1a2e; color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; width: 100%; }
  .toolbar { display: flex; gap: 12px; margin: 16px 0; flex-wrap: wrap; align-items: center; }
  .toolbar input { flex: 1; min-width: 200px; padding: 10px 14px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; }
  .toolbar input:focus { border-color: #1a1a2e; }
  .toolbar select { padding: 10px 14px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; background: white; }
  .stats { font-size: 13px; color: #888; margin-bottom: 12px; }
  table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  th { background: #1a1a2e; color: white; padding: 10px 12px; font-size: 12px; text-align: left; text-transform: uppercase; letter-spacing: .5px; }
  td { padding: 10px 12px; font-size: 13px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
  tr:hover td { background: #fafafa; }
  .nome-cell { max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .preco-input { width: 90px; padding: 6px 8px; border: 2px solid #ddd; border-radius: 6px; font-size: 13px; text-align: center; outline: none; }
  .preco-input:focus { border-color: #1a1a2e; }
  .preco-input.tem-marca { border-color: #00a86b; background: #f0fff4; }
  .btn-salvar { padding: 5px 12px; font-size: 12px; border: none; border-radius: 6px; cursor: pointer; background: #1a1a2e; color: white; }
  .btn-salvar:disabled { opacity: .4; cursor: default; }
  .btn-salvando { background: #999; }
  .ok-msg { color: #00a86b; font-size: 11px; font-weight: 600; }
  .tabs { display: flex; gap: 0; margin-bottom: 16px; }
  .tabs button { padding: 10px 20px; border: none; background: #e6e6e6; cursor: pointer; font-size: 14px; font-weight: 600; border-radius: 8px 8px 0 0; transition: background .2s; }
  .tabs button.ativo { background: white; color: #0b2b40; }
  .tabs button:hover:not(.ativo) { background: #ddd; }
  .tab-content { display: none; }
  .tab-content.ativo { display: block; }
  .config-box { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,.08); max-width: 600px; }
  .config-box label { display: block; font-size: 13px; font-weight: 600; color: #555; margin: 16px 0 4px; }
  .config-box input { width: 100%; padding: 10px 14px; border: 2px solid #e6e6e6; border-radius: 8px; font-size: 14px; outline: none; }
  .config-box input:focus { border-color: #f2b622; }
  .config-box .preview { max-width: 100%; max-height: 120px; margin-top: 8px; border-radius: 6px; border: 1px solid #e6e6e6; display: none; object-fit: contain; }
  .config-box .preview.visible { display: block; }
  .config-box .btn-salvar-config { margin-top: 20px; padding: 10px 24px; background: #0b2b40; color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
  .config-box .btn-salvar-config:disabled { opacity: .5; cursor: default; }
  .config-msg { font-size: 12px; margin-top: 8px; min-height: 18px; }
  .pagination { display: flex; gap: 8px; justify-content: center; align-items: center; margin: 20px 0; }
  .pagination button { padding: 8px 14px; border: 1px solid #ddd; background: white; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .pagination button:disabled { opacity: .4; cursor: default; }
  .pagination button:hover:not(:disabled) { background: #f0f0f0; }
  .pagination span { font-size: 13px; color: #888; }
  .loading { text-align: center; padding: 40px; color: #999; }
  .spinner { border: 3px solid #f0f0f0; border-top: 3px solid #1a1a2e; border-radius: 50%; width: 28px; height: 28px; animation: spin .8s linear infinite; margin: 0 auto 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .erro { color: #e63946; text-align: center; padding: 20px; }
  .filtro-marca { display: flex; gap: 6px; flex-wrap: wrap; }
  .filtro-marca button { padding: 4px 12px; border: 1px solid #ddd; background: white; border-radius: 12px; font-size: 11px; cursor: pointer; }
  .filtro-marca button.ativo { background: #1a1a2e; color: white; border-color: #1a1a2e; }
  .badge { display: inline-block; background: #e8f5e9; color: #2e7d32; padding: 2px 8px; border-radius: 4px; font-size: 11px; }
  @media (max-width: 768px) {
    table { font-size: 12px; }
    td, th { padding: 8px; }
    .nome-cell { max-width: 140px; }
    .preco-input { width: 70px; font-size: 12px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>Admin - Ousamais</h1>
  <a href="/" target="_blank">Ver Catalogo</a>
</div>

<div style="max-width:1200px;margin:0 auto;padding:20px 20px 0">
  <div class="tabs">
    <button class="ativo" onclick="ativarTab('produtos')" id="tabBtnProdutos">Produtos</button>
    <button onclick="ativarTab('config')" id="tabBtnConfig">Configuracoes</button>
  </div>
</div>

<div class="container" id="app"></div>
<div class="container" id="appConfig" style="display:none"></div>

<script>
var SUPABASE_URL = 'https://qfewcmoyzrezyxasvqny.supabase.co';
var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFmZXdjbW95enJlenl4YXN2cW55Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0MDQ5NzAsImV4cCI6MjEwMDk4MDk3MH0.vSCoZXe46EZ4fPYjJGve_MxXmARwEElo0XWEA4u7uFI';
var SENHA = 'admin123';
var LIMITE = 50;

var app = document.getElementById('app');
var appConfig = document.getElementById('appConfig');
var produtos = [];
var total = 0;
var pagina = 0;
var busca = '';
var filtroMarca = '';
var editando = {};
var margemGlobal = 30;
var margensMarcas = {};

function login() {
  app.innerHTML = '<div class="login-box"><h2>Acesso Restrito</h2><input type="password" id="senhaInput" placeholder="Digite a senha" onkeydown="if(event.key===\'Enter\')entrar()"><button onclick="entrar()">Entrar</button></div>';
  document.getElementById('senhaInput').focus();
}

function entrar() {
  if (document.getElementById('senhaInput').value === SENHA) {
    carregar();
  } else {
    alert('Senha incorreta');
  }
}

function api(path, opts) {
  return fetch(SUPABASE_URL + '/rest/v1/' + path, Object.assign({
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' }
  }, opts || {}));
}

function carregar() {
  pagina = 0;
  render();
  contar();
  buscar();
  carregarConfig();
}

function contar() {
  var filtros = 'ativo=eq.true' + (filtroMarca ? '&preco_marca=is.' + (filtroMarca === 'com' ? 'not.null' : 'null') : '');
  api('produtos?select=count&' + filtros).then(function(r) { return r.json(); }).then(function(d) { total = d[0].count; render(); }).catch(function() {});
}

function buscar() {
  var offset = pagina * LIMITE;
  var filtros = 'ativo=eq.true&order=categoria.asc,nome.asc&limit=' + LIMITE + '&offset=' + offset;
  if (filtroMarca) {
    filtros += '&preco_marca=is.' + (filtroMarca === 'com' ? 'not.null' : 'null');
  }
  if (busca) {
    filtros += '&or=(nome.ilike.*' + encodeURIComponent(busca) + '*,categoria.ilike.*' + encodeURIComponent(busca) + '*)';
  }
  api('produtos?select=id,nome,categoria,preco_venda,preco_marca,margem&' + filtros).then(function(r) { return r.json(); }).then(function(d) {
    produtos = d;
    render();
  }).catch(function(e) { app.innerHTML = '<div class="erro">Erro: ' + e.message + '</div>'; });
}

function salvar(id) {
  var input = document.getElementById('pm_' + id);
  if (!input) return;
  var val = input.value.replace(/\./g, '').replace(',', '.').trim();
  var num = val ? parseFloat(val) : null;
  if (val && (isNaN(num) || num <= 0)) { alert('Valor invalido'); return; }

  var inputMargem = document.getElementById('mg_' + id);
  var margemVal = inputMargem ? inputMargem.value.replace(',', '.').trim() : '';
  var margemNum = margemVal ? parseFloat(margemVal) : null;
  if (margemVal && (isNaN(margemNum) || margemNum < 0)) { alert('Margem invalida'); return; }

  var btn = document.getElementById('btn_' + id);
  btn.disabled = true;
  btn.textContent = 'Salvando...';
  btn.className = 'btn-salvar btn-salvando';

  var data = { preco_marca: num };
  if (margemNum != null) { data.margem = margemNum; } else { data.margem = null; }
  api('produtos?id=eq.' + id, { method: 'PATCH', body: JSON.stringify(data), headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' } })
    .then(function(r) {
      if (!r.ok) throw new Error(r.status);
      var ok = document.getElementById('ok_' + id);
      if (num) { input.className = 'preco-input tem-marca'; ok.textContent = 'Salvo!'; } else { input.className = 'preco-input'; ok.textContent = 'Removido!'; }
      btn.textContent = 'Salvar';
      btn.className = 'btn-salvar';
      btn.disabled = false;
      setTimeout(function() { ok.textContent = ''; }, 2000);
    })
    .catch(function(e) {
      btn.textContent = 'Erro';
      btn.className = 'btn-salvar';
      btn.disabled = false;
      alert('Erro ao salvar: ' + e.message);
    });
}

function formatarPreco(valor) {
  if (valor == null) return '';
  return 'R$ ' + parseFloat(valor).toFixed(2).replace('.', ',');
}

function margemEfetiva(p) {
  if (p.margem != null) return parseFloat(p.margem);
  var m = margensMarcas[(p.categoria || '').trim()];
  if (m != null) return parseFloat(m);
  return margemGlobal;
}

function atualizarBadgeMargem(id) {
  var inp = document.getElementById('mg_' + id);
  var bdg = document.getElementById('mgb_' + id);
  if (!inp || !bdg) return;
  var val = inp.value.replace(',', '.').trim();
  var num = val ? parseFloat(val) : null;
  if (num != null && !isNaN(num)) {
    bdg.textContent = num + '%';
  } else {
    var prod = produtos.filter(function(x) { return String(x.id) === String(id); })[0];
    bdg.textContent = prod ? margemEfetiva(prod) + '%' : 'auto';
  }
}

function render() {
  if (!produtos) return;

  var paginas = Math.ceil(total / LIMITE);

  app.innerHTML = '<div class="toolbar">'
    + '<input type="text" id="buscaInput" placeholder="Buscar produto..." value="' + busca + '" onkeydown="if(event.key===\'Enter\'){busca=this.value;carregar()}">'
    + '<select id="catFiltro" onchange="filtroMarca=this.value;carregar()">'
    + '<option value="">Todas as Marcas</option>'
    + '<option value="com"' + (filtroMarca === 'com' ? ' selected' : '') + '>Com Preco Marca</option>'
    + '<option value="sem"' + (filtroMarca === 'sem' ? ' selected' : '') + '>Sem Preco Marca</option>'
    + '</select>'
    + '</div>'
    + '<div class="stats">' + total + ' produtos ativos' + (filtroMarca ? ' | Filtrando: ' + (filtroMarca === 'com' ? 'Com preco marca' : 'Sem preco marca') : '') + '</div>'
    + '<div style="overflow-x:auto"><table>'
    + '<thead><tr><th>Produto</th><th>Categoria</th><th>Nosso Preco</th><th>Preco Marca</th><th>Margem %</th><th></th></tr></thead>'
    + '<tbody>'
    + produtos.map(function(p) {
        var pm = p.preco_marca;
        var desconto = pm ? Math.round((1 - parseFloat(p.preco_venda) / parseFloat(pm)) * 100) : 0;
        return '<tr>'
          + '<td class="nome-cell">' + p.nome + '</td>'
          + '<td>' + (p.categoria || '-') + '</td>'
          + '<td>' + formatarPreco(p.preco_venda) + '</td>'
          + '<td><input class="preco-input' + (pm ? ' tem-marca' : '') + '" id="pm_' + p.id + '" type="text" value="' + (pm || '') + '" placeholder="0,00" oninput="document.getElementById(\'ok_' + p.id + '\').textContent=\'\'">'
          + (pm ? ' <span class="badge">-' + desconto + '%</span>' : '')
          + '</td>'
          + '<td><input class="preco-input" id="mg_' + p.id + '" type="text" value="' + (p.margem != null ? p.margem : '') + '" placeholder="auto" oninput="document.getElementById(\'ok_' + p.id + '\').textContent=\'\';atualizarBadgeMargem(\'' + p.id + '\')">'
          + ' <span class="badge" id="mgb_' + p.id + '">' + (p.margem != null ? parseFloat(p.margem) + '%' : margemEfetiva(p) + '%') + '</span></td>'
          + '<td><button class="btn-salvar" id="btn_' + p.id + '" onclick="salvar(\'' + p.id + '\')">Salvar</button> <span class="ok-msg" id="ok_' + p.id + '"></span></td>'
          + '</tr>';
      }).join('')
    + '</tbody></table></div>'
    + '<div class="pagination">'
    + '<button onclick="pagina=0;buscar()" ' + (pagina === 0 ? 'disabled' : '') + '>Primeira</button>'
    + '<button onclick="pagina=Math.max(0,pagina-1);buscar()" ' + (pagina === 0 ? 'disabled' : '') + '>Anterior</button>'
    + '<span>Pagina ' + (pagina + 1) + ' de ' + paginas + '</span>'
    + '<button onclick="pagina=Math.min(' + (paginas - 1) + ',pagina+1);buscar()" ' + (pagina >= paginas - 1 ? 'disabled' : '') + '>Proxima</button>'
    + '<button onclick="pagina=' + (paginas - 1) + ';buscar()" ' + (pagina >= paginas - 1 ? 'disabled' : '') + '>Ultima</button>'
    + '</div>';
}

var configCache = {};

function ativarTab(tab) {
  document.querySelectorAll('.tabs button').forEach(function(b) { b.classList.remove('ativo'); });
  document.getElementById('tabBtn' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('ativo');
  if (tab === 'produtos') {
    app.style.display = 'block';
    appConfig.style.display = 'none';
  } else {
    app.style.display = 'none';
    appConfig.style.display = 'block';
    renderConfig();
  }
}

function carregarConfig() {
  return api('config?select=*').then(function(r) { return r.json(); }).then(function(dados) {
    configCache = {};
    dados.forEach(function(item) { configCache[item.chave] = item.valor; });
    if (configCache.margem_global) margemGlobal = parseFloat(configCache.margem_global);
    try { margensMarcas = JSON.parse(configCache.margens_marcas || '{}'); } catch (e) { margensMarcas = {}; }
    return configCache;
  });
}

function salvarConfig(chave, valor) {
  var data = { chave: chave, valor: valor };
  return api('config?chave=eq.' + chave, {
    method: 'PATCH',
    body: JSON.stringify(data),
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' }
  }).then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    configCache[chave] = valor;
  });
}

function renderConfig() {
  var sqlLink = 'https://supabase.com/dashboard/project/qfewcmoyzrezyxasvqny/sql/new';
  var sqlCode = encodeURIComponent('CREATE TABLE IF NOT EXISTS config (chave TEXT PRIMARY KEY, valor TEXT);\nALTER TABLE config DISABLE ROW LEVEL SECURITY;\nINSERT INTO config (chave, valor) VALUES\n  (\'logo_url\', \'\'),\n  (\'banner_url\', \'\'),\n  (\'texto_subtitulo\', \'\'),\n  (\'texto_busca\', \'\'),\n  (\'texto_rodape\', \'\'),\n  (\'margem_global\', \'30\'),\n  (\'margens_marcas\', \'{}\')\nON CONFLICT (chave) DO NOTHING;');

  carregarConfig().then(function() {
    appConfig.innerHTML = '<div class="config-box">'
      + '<h2 style="margin-bottom:16px;font-size:18px;color:#0b2b40">Personalizar Catalogo</h2>'
      + '<p style="font-size:13px;color:#888;margin-bottom:16px">Defina as URLs das imagens. Use links diretos (IMGUR, ImgBB, etc).</p>'

      + '<label>URL da Logo</label>'
      + '<input type="url" id="inputLogo" value="' + (configCache.logo_url || '') + '" placeholder="https://i.imgur.com/...png">'
      + '<img class="preview' + (configCache.logo_url ? ' visible' : '') + '" id="previewLogo" src="' + (configCache.logo_url || '') + '" onerror="this.classList.remove(\'visible\')">'

      + '<label>URL do Banner</label>'
      + '<input type="url" id="inputBanner" value="' + (configCache.banner_url || '') + '" placeholder="https://i.imgur.com/...jpg">'
      + '<img class="preview' + (configCache.banner_url ? ' visible' : '') + '" id="previewBanner" src="' + (configCache.banner_url || '') + '" onerror="this.classList.remove(\'visible\')">'

      + '<label>Texto do Subtitulo (abaixo da logo)</label>'
      + '<input type="text" id="inputSubtitulo" value="' + (configCache.texto_subtitulo || '') + '" placeholder="Mais de 1.000 produtos direto da distribuidora para voce">'

      + '<label>Texto de Busca (placeholder)</label>'
      + '<input type="text" id="inputBusca" value="' + (configCache.texto_busca || '') + '" placeholder="O que procura hoje?">'

      + '<label>Texto do Rodape</label>'
      + '<input type="text" id="inputRodape" value="' + (configCache.texto_rodape || '') + '" placeholder="Ousamais (c) 2026 - Precos sujeitos a alteracao sem aviso previo">'

      + '<label>Margem Padrao (%)</label>'
      + '<input type="number" id="inputMargemGlobal" value="' + (configCache.margem_global || '30') + '" step="0.5" min="0">'
      + '<p style="font-size:12px;color:#888;margin-top:4px">Porcentagem adicionada sobre o preco da distribuidora. Aplicada a todos os produtos que nao tenham margem propria (por marca ou por produto).</p>'

      + '<label>Margens por Marca (%)</label>'
      + '<div id="margensMarcasBox" style="max-height:280px;overflow-y:auto;border:1px solid #eee;border-radius:8px;padding:10px;background:#fafafa"></div>'
      + '<p style="font-size:12px;color:#888;margin-top:4px">Deixe em branco para usar a margem padrao. A margem por produto (aba Produtos) tem prioridade sobre a marca.</p>'

      + '<div class="config-msg" id="configMsg"></div>'
      + '<button class="btn-salvar-config" id="btnSalvarConfig" onclick="salvarConfigs()">Salvar Configuracoes</button>'
      + ' <button class="btn-salvar-config" id="btnRecalcular" onclick="recalcularPrecos()">Recalcular Precos</button>'
      + '</div>';

    document.getElementById('inputLogo').oninput = function() { previewImagem('inputLogo', 'previewLogo'); };
    document.getElementById('inputBanner').oninput = function() { previewImagem('inputBanner', 'previewBanner'); };
    carregarMarcas();
  }).catch(function(e) {
    appConfig.innerHTML = '<div class="config-box" style="text-align:center;padding:40px">'
      + '<h2 style="color:#0b2b40;margin-bottom:12px">Primeiro acesso</h2>'
      + '<p style="font-size:14px;color:#666;margin-bottom:20px">A tabela de configuracoes ainda nao existe no banco de dados.</p>'
      + '<p style="font-size:13px;color:#888;margin-bottom:20px">Clique no botao abaixo para criar a tabela automaticamente no Supabase:</p>'
      + '<a href="' + sqlLink + '?sql=' + sqlCode + '" target="_blank" style="display:inline-block;padding:12px 24px;background:#0b2b40;color:white;text-decoration:none;border-radius:8px;font-size:14px;font-weight:600">Criar Tabela de Config</a>'
      + '<p style="margin-top:16px;font-size:12px;color:#999">Apos criar, clique em "Salvar Configuracoes" ou <a href="#" onclick="renderConfig();return false" style="color:#0b2b40">recarregue esta pagina</a></p>'
      + '</div>';
  });
}

function previewImagem(inputId, previewId) {
  var url = document.getElementById(inputId).value.trim();
  var img = document.getElementById(previewId);
  if (url) {
    img.src = url;
    img.classList.add('visible');
  } else {
    img.classList.remove('visible');
  }
}

function salvarConfigs() {
  var btn = document.getElementById('btnSalvarConfig');
  btn.disabled = true;
  btn.textContent = 'Salvando...';
  var msg = document.getElementById('configMsg');
  msg.style.color = '#888';
  msg.textContent = 'Salvando...';

  var margensMarcas = {};
  document.querySelectorAll('.margem-marca').forEach(function(input) {
    var v = input.value.replace(',', '.').trim();
    if (v) {
      var num = parseFloat(v);
      if (!isNaN(num)) margensMarcas[input.getAttribute('data-marca')] = num;
    }
  });

  Promise.all([
    salvarConfig('logo_url', document.getElementById('inputLogo').value.trim()),
    salvarConfig('banner_url', document.getElementById('inputBanner').value.trim()),
    salvarConfig('texto_subtitulo', document.getElementById('inputSubtitulo').value.trim()),
    salvarConfig('texto_busca', document.getElementById('inputBusca').value.trim()),
    salvarConfig('texto_rodape', document.getElementById('inputRodape').value.trim()),
    salvarConfig('margem_global', document.getElementById('inputMargemGlobal').value.trim() || '30'),
    salvarConfig('margens_marcas', JSON.stringify(margensMarcas))
  ]).then(function() {
    msg.style.color = '#00a86b';
    msg.textContent = 'Configuracoes salvas! Apos alterar margens, clique em "Recalcular Precos".';
    btn.disabled = false;
    btn.textContent = 'Salvar Configuracoes';
  }).catch(function(e) {
    msg.style.color = '#e63946';
    msg.textContent = 'Erro: ' + e.message;
    btn.disabled = false;
    btn.textContent = 'Salvar Configuracoes';
  });
}

function carregarMarcas() {
  var box = document.getElementById('margensMarcasBox');
  if (!box) return;
  box.innerHTML = '<div class="loading" style="padding:15px;font-size:13px">Carregando marcas...</div>';

  var margens = {};
  try { margens = JSON.parse(configCache.margens_marcas || '{}'); } catch (e) { margens = {}; }

  var headers = { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY };
  var baseUrl = SUPABASE_URL + '/rest/v1/produtos?select=categoria&ativo=eq.true&limit=1000&offset=';
  Promise.all([
    fetch(baseUrl + '0', { headers: headers }),
    fetch(baseUrl + '1000', { headers: headers })
  ]).then(function(resps) {
    return Promise.all(resps.map(function(r) { return r.json(); }));
  }).then(function(dados) {
    var set = {};
    dados.forEach(function(arr) {
      arr.forEach(function(d) { if (d.categoria) set[d.categoria] = true; });
    });
    var marcas = Object.keys(set).sort();

    box.innerHTML = marcas.length
      ? marcas.map(function(m) {
          var v = margens[m] != null ? margens[m] : '';
          return '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">'
            + '<span style="flex:1;font-size:13px;color:#333;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + m + '</span>'
            + '<input type="number" class="margem-marca" data-marca="' + m.replace(/"/g, '&quot;') + '" value="' + v + '" style="width:64px;padding:6px;border:2px solid #e6e6e6;border-radius:6px;font-size:13px;text-align:center" placeholder="auto">'
            + '<span style="font-size:12px;color:#999">%</span>'
            + '</div>';
        }).join('')
      : '<div style="padding:12px;color:#999;font-size:13px;text-align:center">Nenhuma marca encontrada</div>';
  }).catch(function(e) {
    box.innerHTML = '<div style="padding:12px;color:#e63946;font-size:13px">Erro: ' + e.message + '</div>';
  });
}

function recalcularPrecos() {
  var msg = document.getElementById('configMsg');
  var btn = document.getElementById('btnRecalcular');
  if (!msg) return;
  msg.style.color = '#888';
  msg.textContent = 'Recalculando precos... (pode levar alguns segundos)';
  if (btn) btn.disabled = true;

  return fetch(SUPABASE_URL + '/rest/v1/rpc/recalcular_precos', {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: '{}'
  }).then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status + ': ' + r.statusText);
    return r.json();
  }).then(function(contagem) {
    msg.style.color = '#00a86b';
    msg.textContent = contagem + ' precos recalculados com sucesso!';
    if (btn) btn.disabled = false;
  }).catch(function(e) {
    msg.style.color = '#e63946';
    msg.textContent = 'Erro ao recalcular: ' + e.message + '. Confira se a funcao recalcular_precos existe no Supabase.';
    if (btn) btn.disabled = false;
  });
}

login();
</script>
