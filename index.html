<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalogo Ousamais</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: #f5f5f5; color: #333; }

  .header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); color: white; padding: 20px; text-align: center; position: sticky; top: 0; z-index: 100; }
  .header h1 { font-size: 22px; }
  .header p { font-size: 13px; opacity: .8; }

  .layout { display: flex; max-width: 1400px; margin: 0 auto; min-height: 100vh; }

  .sidebar {
    width: 240px; min-width: 240px; background: white; border-right: 1px solid #eee;
    padding: 20px 0; position: sticky; top: 78px; align-self: flex-start; max-height: calc(100vh - 78px);
    overflow-y: auto; z-index: 50;
  }
  .sidebar-title { padding: 0 16px 12px; font-size: 12px; text-transform: uppercase; color: #999; letter-spacing: 1px; font-weight: 600; }
  .sidebar-item {
    padding: 10px 16px; cursor: pointer; font-size: 14px; color: #555;
    transition: all .15s; border-left: 3px solid transparent; display: flex; align-items: center; gap: 8px;
  }
  .sidebar-item:hover { background: #f8f8f8; color: #1a1a2e; }
  .sidebar-item.ativo { background: #f0f0ff; color: #1a1a2e; border-left-color: #1a1a2e; font-weight: 600; }
  .sidebar-item .count { margin-left: auto; font-size: 11px; color: #bbb; }
  .sidebar-toggle {
    display: none; position: fixed; bottom: 80px; left: 16px; z-index: 200;
    width: 44px; height: 44px; border-radius: 50%; border: none; background: #1a1a2e; color: white;
    font-size: 20px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.25);
  }
  .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 150; }

  .content { flex: 1; padding: 20px; min-width: 0; }

  .search-bar input {
    width: 100%; padding: 12px 16px; border: 2px solid #ddd; border-radius: 10px;
    font-size: 15px; outline: none; transition: border-color .3s;
  }
  .search-bar input:focus { border-color: #1a1a2e; }

  .topo-header { display: flex; align-items: center; gap: 12px; margin: 16px 0; }
  .topo-header .hamburger {
    display: none; width: 36px; height: 36px; border: none; background: #1a1a2e; color: white;
    border-radius: 8px; font-size: 18px; cursor: pointer; flex-shrink: 0;
  }
  .contador { font-size: 13px; color: #999; margin-left: auto; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.08); transition: transform .2s; }
  .card:hover { transform: translateY(-3px); box-shadow: 0 4px 16px rgba(0,0,0,.12); }
  .card-img { width: 100%; height: 260px; object-fit: cover; background: #f0f0f0; display: flex; align-items: center; justify-content: center; color: #ccc; font-size: 13px; }
  .card-body { padding: 14px; }
  .categoria-tag { display: inline-block; background: #f0f0f0; padding: 3px 10px; border-radius: 4px; font-size: 11px; color: #666; margin-bottom: 8px; }
  .card-body h3 { font-size: 14px; line-height: 1.4; margin-bottom: 10px; }
  .preco-original { font-size: 12px; color: #999; text-decoration: line-through; }
  .preco-venda { font-size: 22px; color: #e63946; font-weight: bold; margin: 2px 0; }
  .parcela { font-size: 13px; color: #666; margin: 5px 0 10px; }
  .btn-whatsapp {
    display: block; background: #25D366; color: white; text-align: center;
    padding: 11px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 14px; transition: background .2s;
  }
  .btn-whatsapp:hover { background: #1da951; }

  .loading { text-align: center; padding: 80px 20px; font-size: 16px; color: #999; }
  .spinner { border: 3px solid #f0f0f0; border-top: 3px solid #1a1a2e; border-radius: 50%; width: 36px; height: 36px; animation: spin .8s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .footer { text-align: center; padding: 30px; color: #999; font-size: 13px; }

  .btn-topo {
    position: fixed; bottom: 24px; right: 24px; z-index: 200;
    width: 44px; height: 44px; border-radius: 50%; border: none; background: #1a1a2e; color: white;
    font-size: 20px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.25);
    display: none; align-items: center; justify-content: center; transition: opacity .3s;
  }
  .btn-topo:hover { opacity: .85; }

  @media (max-width: 768px) {
    .sidebar { display: none; position: fixed; top: 0; left: 0; height: 100vh; max-height: 100vh; z-index: 200; border-radius: 0 16px 16px 0; box-shadow: 4px 0 20px rgba(0,0,0,.15); width: 260px; padding-top: 60px; }
    .sidebar.aberta { display: block; }
    .sidebar-overlay.ativa { display: block; }
    .sidebar-toggle { display: flex; align-items: center; justify-content: center; }
    .topo-header .hamburger { display: block; }
    .layout { flex-direction: column; }
    .content { padding: 12px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
    .card-img { height: 180px; }
    .preco-venda { font-size: 18px; }
    .header h1 { font-size: 18px; }
    .btn-topo { bottom: 16px; right: 16px; width: 40px; height: 40px; font-size: 18px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>Catalogo Ousamais</h1>
  <p>Perfumes originais com os melhores precos</p>
</div>

<div class="layout">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-title">Marcas</div>
    <div id="filtros"></div>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <button class="sidebar-toggle" id="sidebarToggle" aria-label="Abrir marcas">&#9776;</button>

  <main class="content">
    <div class="search-bar">
      <div class="topo-header">
        <button class="hamburger" id="hamburgerBtn" aria-label="Abrir marcas">&#9776;</button>
        <div style="flex:1"><input type="text" id="busca" placeholder="Buscar produto..." oninput="filtrar()"></div>
        <div class="contador" id="contador"></div>
      </div>
    </div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      Carregando catalogo...
    </div>

    <div class="grid" id="grid"></div>

    <div class="footer">
      Ousamais &copy; 2026 - Precos sujeitos a alteracao sem aviso previo
    </div>
  </main>

</div>

<button class="btn-topo" id="btnTopo" aria-label="Voltar ao topo">&#8593;</button>

<script>
const SUPABASE_URL = 'https://qfewcmoyzrezyxasvqny.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFmZXdjbW95enJlenl4YXN2cW55Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0MDQ5NzAsImV4cCI6MjEwMDk4MDk3MH0.vSCoZXe46EZ4fPYjJGve_MxXmARwEElo0XWEA4u7uFI';
const WHATSAPP_NUMERO = '5575998078956';
let todosProdutos = [];
let categoriaAtiva = '';

async function carregar() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/produtos?select=*&ativo=eq.true&order=categoria.asc`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
    });
    if (!res.ok) throw new Error('HTTP ' + res.status + ': ' + await res.text());
    todosProdutos = await res.json();
    document.getElementById('loading').style.display = 'none';
    renderizarFiltros();
    renderizar();
  } catch (err) {
    document.getElementById('loading').innerHTML = 'Erro ao carregar: ' + err.message;
  }
}

function renderizarFiltros() {
  const container = document.getElementById('filtros');
  container.innerHTML = '';

  const categorias = [...new Set(todosProdutos.map(function(p) { return p.categoria; }).filter(Boolean))].sort();

  function selecionar(cat, el) {
    categoriaAtiva = cat;
    container.querySelectorAll('.sidebar-item').forEach(function(b) { b.classList.remove('ativo'); });
    el.classList.add('ativo');
    filtrar();
    fecharSidebar();
  }

  var todos = document.createElement('div');
  todos.className = 'sidebar-item ativo';
  todos.innerHTML = '<span>Todos</span><span class="count">' + todosProdutos.length + '</span>';
  todos.onclick = function() { selecionar('', todos); };
  container.appendChild(todos);

  categorias.forEach(function(cat) {
    var qtd = todosProdutos.filter(function(p) { return p.categoria === cat; }).length;
    var el = document.createElement('div');
    el.className = 'sidebar-item';
    el.innerHTML = '<span>' + cat + '</span><span class="count">' + qtd + '</span>';
    el.onclick = function() { selecionar(cat, el); };
    container.appendChild(el);
  });
}

function fecharSidebar() {
  document.getElementById('sidebar').classList.remove('aberta');
  document.getElementById('sidebarOverlay').classList.remove('ativa');
}

function abrirSidebar() {
  document.getElementById('sidebar').classList.add('aberta');
  document.getElementById('sidebarOverlay').classList.add('ativa');
}

document.getElementById('sidebarToggle').onclick = abrirSidebar;
document.getElementById('hamburgerBtn').onclick = abrirSidebar;
document.getElementById('sidebarOverlay').onclick = fecharSidebar;

function filtrar() {
  var busca = document.getElementById('busca').value.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  var produtos = todosProdutos;

  if (categoriaAtiva) {
    produtos = produtos.filter(function(p) { return p.categoria === categoriaAtiva; });
  }
  if (busca) {
    produtos = produtos.filter(function(p) {
      return p.nome.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').includes(busca);
    });
  }
  renderizar(produtos);
}

function formatarPreco(valor) {
  return 'R$ ' + valor.toFixed(2).replace('.', ',');
}

function renderizar(produtos) {
  var grid = document.getElementById('grid');
  var lista = produtos || todosProdutos;
  document.getElementById('contador').textContent = lista.length + ' produto' + (lista.length !== 1 ? 's' : '');

  grid.innerHTML = lista.map(function(p) {
    var parcela = (p.preco_venda / 6).toFixed(2);
    var texto = 'Ola, quero aproveitar a oferta do ' + p.nome + '!';
    var link = 'https://wa.me/' + WHATSAPP_NUMERO + '?text=' + encodeURIComponent(texto);
    var img = p.imagem_url || '';
    var nome = p.nome;
    var cat = p.categoria || 'Geral';
    var po = formatarPreco(p.preco_original);
    var pv = formatarPreco(p.preco_venda);
    var parc = formatarPreco(parseFloat(parcela));

    return '<div class="card">'
      + (img
        ? '<img class="card-img" src="' + img + '" alt="' + nome + '" loading="lazy" onerror="this.onerror=null;this.parentNode.innerHTML=\'<div class=card-img>Sem imagem</div>\'">'
        : '<div class="card-img">Sem imagem</div>')
      + '<div class="card-body">'
      + '<span class="categoria-tag">' + cat + '</span>'
      + '<h3>' + nome + '</h3>'
      + '<div class="preco-original">' + po + '</div>'
      + '<div class="preco-venda">' + pv + '</div>'
      + '<div class="parcela">Ou 6x de ' + parc + ' sem juros</div>'
      + '<a class="btn-whatsapp" href="' + link + '" target="_blank">Comprar via WhatsApp</a>'
      + '</div></div>';
  }).join('');
}

var btnTopo = document.getElementById('btnTopo');
window.onscroll = function() {
  btnTopo.style.display = window.scrollY > 400 ? 'flex' : 'none';
};
btnTopo.onclick = function() {
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

carregar();
</script>
</body>
</html>
